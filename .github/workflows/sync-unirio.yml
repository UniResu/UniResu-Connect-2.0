# Sincronização semanal dos projetos de pesquisa e extensão dos portais da UNIRIO.
#
# Roda o job backend/jobs/sync_unirio.py contra o MongoDB de produção.
# Pré-requisitos (ver README → "Sync com a UNIRIO"): os mesmos do sync do
# SIGAA — secret MONGO_URI do usuário exclusivo do job (acesso a `projetos`
# e `sigaa_sync_runs`) e Network Access do Atlas liberado para 0.0.0.0/0.
#
# Modos da execução manual:
#   sync     → coleta e grava (padrão; é o que o agendamento roda)
#   dry-run  → coleta e imprime estatísticas/amostras, sem gravar nada
#   captura  → salva o HTML bruto das páginas como artifact "captura-unirio"
#              (para atualizar o parser e as fixtures de teste)

name: Sync UNIRIO

on:
  # Agendamento desligado até o parser ser validado com o HTML real dos portais
  # (rode `captura`, ajuste parser/fixtures, depois `dry-run` e `sync` manuais).
  # Quando estiver validado, reative:
  # schedule:
  #   # Toda segunda-feira às 10:00 UTC (uma hora depois do sync do SIGAA).
  #   - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução"
        type: choice
        options: [sync, dry-run, captura]
        default: sync
      modulos:
        description: "Módulos: pesquisa,extensao (vazio = ambos)"
        required: false
        default: ""
      max_detalhes:
        description: "Teto de detalhes consultados por módulo (0 = todos; útil no dry-run)"
        required: false
        default: ""
      detalhes:
        description: "Detalhes a reabrir: incremental (só novos e, na pesquisa, os em execução) ou completo (todos)"
        type: choice
        options: [incremental, completo]
        default: incremental

concurrency:
  group: sync-unirio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Listar os dois portais leva ~16 min (2314 + 386 itens, pausa de 1,5 s).
    # No modo incremental só os detalhes novos e os de pesquisa em execução
    # são reabertos (minutos); "completo" baixa ~2700 páginas de detalhe, perto
    # de 2 h. A folga cobre as quedas de conexão dos portais da UNIRIO.
    timeout-minutes: 300
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sync
        run: |
          case "${{ inputs.modo || 'sync' }}" in
            captura) python -m jobs.sync_unirio --captura ;;
            dry-run) python -m jobs.sync_unirio --dry-run ;;
            *)       python -m jobs.sync_unirio ;;
          esac
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'UniResuDB' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE || 'UniResu <contato@uniresu.org>' }}
          UNIRIO_ALERTA_EMAIL: ${{ vars.UNIRIO_ALERTA_EMAIL || vars.SIGAA_ALERTA_EMAIL }}
          UNIRIO_MODULOS: ${{ inputs.modulos || vars.UNIRIO_MODULOS }}
          # Só vale em dry-run/captura; o sync real ignora (com aviso no log).
          UNIRIO_MAX_DETALHES: ${{ inputs.max_detalhes || vars.UNIRIO_MAX_DETALHES }}
          # Execução agendada: incremental (minutos). "completo" relê todos os detalhes (~2 h).
          UNIRIO_DETALHES: ${{ inputs.detalhes || vars.UNIRIO_DETALHES || 'incremental' }}
          UNIRIO_EXTENSAO_STATUS: ${{ vars.UNIRIO_EXTENSAO_STATUS }}
          UNIRIO_PESQUISA_DETALHE_PREFIXO: ${{ vars.UNIRIO_PESQUISA_DETALHE_PREFIXO }}
          UNIRIO_PESQUISA_ANOS: ${{ vars.UNIRIO_PESQUISA_ANOS }}
          UNIRIO_PESQUISA_ANO_MINIMO: ${{ vars.UNIRIO_PESQUISA_ANO_MINIMO }}
          UNIRIO_CAPTURA_DIR: captura

      - name: Publicar HTML capturado
        if: inputs.modo == 'captura'
        uses: actions/upload-artifact@v4
        with:
          name: captura-unirio
          path: backend/captura/
          if-no-files-found: warn
          retention-days: 14
