# Sincronização semanal dos projetos de pesquisa e extensão dos portais da UNIRIO.
#
# Roda o job backend/jobs/sync_unirio.py contra o MongoDB de produção.
# Pré-requisitos (ver README → "Sync com a UNIRIO"): os mesmos do sync do
# SIGAA — secret MONGO_URI do usuário exclusivo do job (acesso a `projetos`
# e `sigaa_sync_runs`) e Network Access do Atlas liberado para 0.0.0.0/0.
#
# Modos da execução manual:
#   sync     → coleta e grava (padrão; é o que o agendamento roda)
#   dry-run  → coleta e imprime estatísticas/amostras, sem gravar nada
#   captura  → imprime o HTML bruto das páginas (para atualizar o parser)

name: Sync UNIRIO

on:
  schedule:
    # Toda segunda-feira às 10:00 UTC (uma hora depois do sync do SIGAA).
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução"
        type: choice
        options: [sync, dry-run, captura]
        default: sync
      modulos:
        description: "Módulos: pesquisa,extensao (vazio = ambos)"
        required: false
        default: ""
      max_detalhes:
        description: "Teto de detalhes consultados por módulo (0 = todos; útil no dry-run)"
        required: false
        default: ""

concurrency:
  group: sync-unirio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sync
        run: |
          case "${{ inputs.modo || 'sync' }}" in
            captura) python -m jobs.sync_unirio --captura ;;
            dry-run) python -m jobs.sync_unirio --dry-run ;;
            *)       python -m jobs.sync_unirio ;;
          esac
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'UniResuDB' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE || 'UniResu <contato@uniresu.org>' }}
          UNIRIO_ALERTA_EMAIL: ${{ vars.UNIRIO_ALERTA_EMAIL || vars.SIGAA_ALERTA_EMAIL }}
          UNIRIO_MODULOS: ${{ inputs.modulos || vars.UNIRIO_MODULOS }}
          UNIRIO_MAX_DETALHES: ${{ inputs.max_detalhes || vars.UNIRIO_MAX_DETALHES }}
          UNIRIO_EXTENSAO_STATUS: ${{ vars.UNIRIO_EXTENSAO_STATUS }}
