# Diagnóstico de fontes de dados públicas que o ambiente de desenvolvimento
# não alcança (portais de universidades, APIs de dados abertos). Baixa cada
# URL informada e imprime no log o status, os cabeçalhos e o início do corpo.
# Só leitura: não usa segredos nem grava nada.

name: Diagnóstico de URL

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaço"
        required: true
      bytes:
        description: "Quantos bytes do início de cada resposta imprimir"
        required: false
        default: "6000"
      cauda:
        description: "Quantos bytes do FIM de cada resposta imprimir (0 = nenhum; útil em CSV grande)"
        required: false
        default: "0"
      csv_colunas:
        description: "Se a resposta for CSV: colunas (separadas por vírgula) cujas contagens de valores imprimir"
        required: false
        default: ""
      resumo:
        description: "Só uma linha por URL (status, tamanho e marcadores encontrados no corpo); serve para testar dezenas de portais de uma vez"
        type: boolean
        default: false
      procurar:
        description: "Modo resumo: termos extras (separados por |) a procurar no corpo, ex.: um trecho do título"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar e mostrar
        env:
          URLS: ${{ inputs.urls }}
          BYTES: ${{ inputs.bytes }}
          CAUDA: ${{ inputs.cauda }}
          CSV_COLUNAS: ${{ inputs.csv_colunas }}
          RESUMO: ${{ inputs.resumo }}
          PROCURAR: ${{ inputs.procurar }}
        run: |
          for url in $URLS; do
            if [ "$RESUMO" = "true" ]; then
              # Uma linha por URL: status final, tamanho e marcadores do corpo.
              rm -f /tmp/h.txt /tmp/b.bin
              erro=""
              curl -sS -L -m 45 -A "UniResuConnect/2.1 (+https://uniresu.org; diagnostico)" \
                -D /tmp/h.txt -o /tmp/b.bin "$url" 2>/dev/null || erro="curl=$?"
              status=$(grep -a '^HTTP/' /tmp/h.txt 2>/dev/null | tail -1 | awk '{print $2}')
              tamanho=$(stat -c %s /tmp/b.bin 2>/dev/null || echo 0)
              achados=""
              for m in "consulta_extensao" "consulta_projetos" "Ano de" "Título" "Unidade" "Coordenador" \
                       "Situação" "login" "senha" "javax.faces" "SIGAA" "Erro" "indisponível"; do
                grep -a -q -i -- "$m" /tmp/b.bin 2>/dev/null && achados="$achados [$m]"
              done
              if [ -n "$PROCURAR" ]; then
                IFS='|' read -ra extras <<< "$PROCURAR"
                for m in "${extras[@]}"; do
                  [ -n "$m" ] && grep -a -q -i -- "$m" /tmp/b.bin 2>/dev/null && achados="$achados [$m]"
                done
              fi
              titulo=$(grep -a -o -i '<title>[^<]*' /tmp/b.bin 2>/dev/null | head -1 | cut -c8-90)
              achados="$achados${titulo:+ | title: $titulo}"
              final=$(grep -a -i '^location:' /tmp/h.txt 2>/dev/null | tail -1 | tr -d '\r' | cut -c11- | cut -c1-120)
              echo "RESUMO | $url | HTTP ${status:--} $erro | ${tamanho} bytes |$achados${final:+ | redirecionou para: $final}"
              continue
            fi
            echo "=================================================================="
            echo "URL: $url"
            curl -sS -L -m 300 -A "UniResuConnect/2.1 (+https://uniresu.org; diagnostico)" \
              -D /tmp/h.txt -o /tmp/b.bin "$url" || echo "curl falhou ($?)"
            echo "--- cabeçalhos"; cat /tmp/h.txt 2>/dev/null | tr -d '\r'
            echo "--- tamanho: $(stat -c %s /tmp/b.bin 2>/dev/null || echo 0) bytes, $(wc -l < /tmp/b.bin 2>/dev/null || echo 0) linhas"
            echo "--- início do corpo"
            head -c "$BYTES" /tmp/b.bin 2>/dev/null | iconv -f utf-8 -t utf-8 -c; echo
            if [ "${CAUDA:-0}" != "0" ]; then
              echo "--- fim do corpo"
              tail -c "$CAUDA" /tmp/b.bin 2>/dev/null | iconv -f utf-8 -t utf-8 -c; echo
            fi
            if [ -n "$CSV_COLUNAS" ]; then
              echo "--- contagens por coluna"
              python3 - "$CSV_COLUNAS" <<'PY'
          import collections, csv, sys
          colunas = [c.strip() for c in sys.argv[1].split(",") if c.strip()]
          csv.field_size_limit(10**8)
          with open("/tmp/b.bin", encoding="utf-8-sig", errors="replace", newline="") as f:
              amostra = f.read(20000); f.seek(0)
              try:
                  dialeto = csv.Sniffer().sniff(amostra, delimiters=";,\t|")
              except csv.Error:
                  dialeto = csv.excel
              leitor = csv.DictReader(f, dialect=dialeto)
              contagens = {c: collections.Counter() for c in colunas}
              linhas = 0
              for linha in leitor:
                  linhas += 1
                  for c in colunas:
                      contagens[c][(linha.get(c) or "").strip()[:80]] += 1
          print(f"delimitador={dialeto.delimiter!r} linhas={linhas} colunas={leitor.fieldnames}")
          for c in colunas:
              print(f"\n[{c}] {len(contagens[c])} valores distintos; os 40 mais comuns:")
              for valor, n in contagens[c].most_common(40):
                  print(f"  {n:8d}  {valor!r}")
          PY
            fi
            rm -f /tmp/h.txt /tmp/b.bin
          done
