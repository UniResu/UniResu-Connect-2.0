# Sync semanal dos projetos de extensão da PUC-Campinas, lidos da página
# pública "Projetos de Extensão" do portal da universidade (uma requisição).
#
# Mesmos pré-requisitos dos outros syncs: secret MONGO_URI do usuário dos
# jobs e Network Access do Atlas liberado (ver README).

name: Sync PUC-Campinas

on:
  schedule:
    # Toda segunda-feira às 10:45 UTC (depois dos syncs do SIGAA, UNIRIO e UFV).
    - cron: "45 10 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução"
        type: choice
        options: [sync, dry-run]
        default: sync

concurrency:
  group: sync-puccamp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sync
        run: |
          if [ "${{ inputs.modo }}" = "dry-run" ]; then
            python -m jobs.sync_puccamp --dry-run
          else
            python -m jobs.sync_puccamp
          fi
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'UniResuDB' }}
