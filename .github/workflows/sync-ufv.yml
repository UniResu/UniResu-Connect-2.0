# Sync semanal dos projetos da UFV, a partir do portal de dados abertos da
# universidade (dados.ufv.br): extensão pela API do CKAN (duas ou três
# consultas) e pesquisa pelo CSV completo do recurso (uns 225 MB, uma
# requisição). Termina em poucos minutos.
#
# Mesmos pré-requisitos dos outros syncs: secret MONGO_URI do usuário dos
# jobs e Network Access do Atlas liberado (ver README).

name: Sync UFV

on:
  schedule:
    # Toda segunda-feira às 10:30 UTC (depois dos syncs do SIGAA e da UNIRIO).
    - cron: "30 10 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução"
        type: choice
        options: [sync, dry-run]
        default: sync
      modulos:
        description: "Módulos: extensao,pesquisa (vazio = ambos)"
        required: false
        default: ""
      pesquisa_ano_minimo:
        description: "Pesquisa: ignorar projetos registrados antes deste ano (vazio = quatro anos atrás)"
        required: false
        default: ""
      pesquisa_situacoes:
        description: "Pesquisa: situações do CSV consideradas vigentes (vazio = Registrado)"
        required: false
        default: ""

concurrency:
  group: sync-ufv
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sync
        run: |
          if [ "${{ inputs.modo }}" = "dry-run" ]; then
            python -m jobs.sync_ufv --dry-run
          else
            python -m jobs.sync_ufv
          fi
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'UniResuDB' }}
          UFV_MODULOS: ${{ inputs.modulos }}
          UFV_PESQUISA_ANO_MINIMO: ${{ inputs.pesquisa_ano_minimo }}
          UFV_PESQUISA_SITUACOES: ${{ inputs.pesquisa_situacoes }}
