# Sincronização semanal dos projetos de pesquisa e extensão das instituições
# que usam o SIGAA (UNIR e as demais de backend/services/sigaa/instituicoes.py).
#
# Roda o job backend/jobs/sync_sigaa.py uma vez por instituição, em paralelo
# limitado, contra o MongoDB de produção. Pré-requisitos (ver README → "Sync
# com o SIGAA"):
#   - secret MONGO_URI com um usuário EXCLUSIVO do job (acesso só a
#     `projetos` e `sigaa_sync_runs`);
#   - Network Access do Atlas liberado para 0.0.0.0/0 (IPs do Actions mudam).
#
# Uma run com falha (ex.: SIGAA retornou 0 projetos) termina em vermelho e
# o GitHub notifica por e-mail quem tem notificações de Actions ativas.

name: Sync SIGAA

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (05:00 em Rondônia, 06:00 em Brasília).
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução"
        type: choice
        options: [sync, dry-run]
        default: sync
      instituicoes:
        description: "Siglas separadas por vírgula (vazio = as ativas em instituicoes.py; 'todas' = todas as conhecidas)"
        required: false
        default: ""
      anos:
        description: "Anos a coletar, separados por vírgula (vazio = ano corrente)"
        required: false
        default: ""
      modulos:
        description: "Módulos: pesquisa,extensao (vazio = ambos)"
        required: false
        default: ""
      max_itens:
        description: "Teto de itens por módulo cujo detalhe é aberto (0 = todos; útil no dry-run)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  # Monta a lista de instituições a partir do input (ou das ativas no código).
  lista:
    runs-on: ubuntu-latest
    outputs:
      instituicoes: ${{ steps.lista.outputs.instituicoes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: lista
        working-directory: backend
        env:
          ESCOLHA: ${{ inputs.instituicoes || vars.SIGAA_INSTITUICOES }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from services.sigaa.instituicoes import ATIVAS, INSTITUICOES_SIGAA, instituicao_sigaa
          escolha = (os.environ.get("ESCOLHA") or "").strip()
          if not escolha:
              siglas = list(ATIVAS)
          elif escolha.lower() == "todas":
              siglas = sorted(INSTITUICOES_SIGAA)
          else:
              siglas = [instituicao_sigaa(s).sigla for s in escolha.split(",") if s.strip()]
          print("instituicoes=" + json.dumps(siglas))
          PY
          cat "$GITHUB_OUTPUT"

  sync:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # Cada job fala com um servidor diferente; o limite protege o Actions,
      # não as universidades (a pausa entre requisições é por servidor).
      max-parallel: 4
      matrix:
        instituicao: ${{ fromJson(needs.lista.outputs.instituicoes) }}
    # Nunca duas runs da mesma instituição ao mesmo tempo.
    concurrency:
      group: sync-sigaa-${{ matrix.instituicao }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sync (${{ matrix.instituicao }})
        run: |
          if [ "${{ inputs.modo }}" = "dry-run" ]; then
            python -m jobs.sync_sigaa --dry-run
          else
            python -m jobs.sync_sigaa
          fi
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'UniResuDB' }}
          SIGAA_INSTITUICAO: ${{ matrix.instituicao }}
          # Opcional: alerta por e-mail quando o sync falha.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE || 'UniResu <contato@uniresu.org>' }}
          SIGAA_ALERTA_EMAIL: ${{ vars.SIGAA_ALERTA_EMAIL }}
          # Filtros (inputs da execução manual > variáveis do repositório > padrão do código).
          SIGAA_ANOS: ${{ inputs.anos || vars.SIGAA_ANOS }}
          SIGAA_MODULOS: ${{ inputs.modulos || vars.SIGAA_MODULOS }}
          SIGAA_MAX_ITENS: ${{ inputs.max_itens }}
          SIGAA_PESQUISA_SITUACAO: ${{ vars.SIGAA_PESQUISA_SITUACAO || 'EM EXECUÇÃO' }}
          SIGAA_EXTENSAO_TIPOS: ${{ vars.SIGAA_EXTENSAO_TIPOS }}
