# Sincronização semanal dos projetos de pesquisa e extensão do SIGAA/UNIR.
#
# Roda o job backend/jobs/sync_sigaa.py contra o MongoDB de produção.
# Pré-requisitos (ver README → "Sync com o SIGAA"):
#   - secret MONGO_URI com um usuário EXCLUSIVO do job (acesso só a
#     `projetos` e `sigaa_sync_runs`);
#   - Network Access do Atlas liberado para 0.0.0.0/0 (IPs do Actions mudam).
#
# Uma run com falha (ex.: SIGAA retornou 0 projetos) termina em vermelho e
# o GitHub notifica por e-mail quem tem notificações de Actions ativas.

name: Sync SIGAA

on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (05:00 em Rondônia, 06:00 em Brasília).
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a coletar, separados por vírgula (vazio = ano corrente)"
        required: false
        default: ""
      modulos:
        description: "Módulos: pesquisa,extensao (vazio = ambos)"
        required: false
        default: ""

# Nunca duas runs ao mesmo tempo; uma nova run espera a anterior terminar.
concurrency:
  group: sync-sigaa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sync
        run: python -m jobs.sync_sigaa
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB_NAME: ${{ vars.MONGO_DB_NAME || 'UniResuDB' }}
          # Opcional: alerta por e-mail quando o sync falha.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_REMETENTE: ${{ vars.EMAIL_REMETENTE || 'UniResu <contato@uniresu.org>' }}
          SIGAA_ALERTA_EMAIL: ${{ vars.SIGAA_ALERTA_EMAIL }}
          # Filtros (inputs da execução manual > variáveis do repositório > padrão do código).
          SIGAA_ANOS: ${{ inputs.anos || vars.SIGAA_ANOS }}
          SIGAA_MODULOS: ${{ inputs.modulos || vars.SIGAA_MODULOS }}
          SIGAA_PESQUISA_SITUACAO: ${{ vars.SIGAA_PESQUISA_SITUACAO || 'EM EXECUÇÃO' }}
          SIGAA_EXTENSAO_TIPOS: ${{ vars.SIGAA_EXTENSAO_TIPOS }}
