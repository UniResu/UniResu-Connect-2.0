# Diagnóstico das consultas públicas do SIGAA, sem gravar nada no banco.
#
# Para cada instituição e módulo, roda backend/jobs/diagnostico_sigaa.py:
# campos do formulário, payload da busca, resposta (mensagens e redirecionamentos),
# linhas cruas da listagem e a tentativa de abrir o detalhe do primeiro item.
# Serve para adaptar o coletor quando a busca volta vazia ou o detalhe não abre.

name: Diagnóstico SIGAA

on:
  workflow_dispatch:
    inputs:
      instituicoes:
        description: "Siglas separadas por vírgula"
        required: true
      modulos:
        description: "Módulos separados por vírgula"
        required: false
        default: "pesquisa,extensao"
      ano:
        description: "Ano da busca (vazio = ano corrente)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Diagnosticar
        env:
          INSTITUICOES: ${{ inputs.instituicoes }}
          MODULOS: ${{ inputs.modulos }}
          ANO: ${{ inputs.ano }}
          SIGAA_PESQUISA_SITUACAO: ${{ vars.SIGAA_PESQUISA_SITUACAO || 'EM EXECUÇÃO' }}
          SIGAA_MAX_TENTATIVAS: "2"
        run: |
          for sigla in ${INSTITUICOES//,/ }; do
            for modulo in ${MODULOS//,/ }; do
              SIGAA_INSTITUICAO="$sigla" python -m jobs.diagnostico_sigaa "$modulo" "$ANO" || echo "!! $sigla $modulo: o diagnóstico parou com erro"
            done
          done
